services:
  # Backend API Web Service
  - type: web
    name: sweety-backend
    runtime: node
    plan: free
    # Use the repository root so the backend can read the canonical database/schema.sql.
    buildCommand: npm ci --prefix server
    startCommand: node server/src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SEED_DEMO_DATA
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: sweety-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://sweety-frontend.onrender.com

  # Frontend Static Site
  - type: web
    name: sweety-frontend
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: sweety-backend
          envVarKey: RENDER_EXTERNAL_URL

databases:
  # Managed PostgreSQL Instance
  - name: sweety-postgres
    plan: free
    databaseName: sweety_db
    user: sweety_user
