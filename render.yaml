services:
  # Backend API Web Service
  - type: web
    name: sweety-backend
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sweety-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        fromService:
          type: web
          name: sweety-frontend
          property: host

  # Frontend Static Site
  - type: web
    name: sweety-frontend
    env: static
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: sweety-backend
          property: host

databases:
  # Managed PostgreSQL Instance
  - name: sweety-postgres
    plan: free
    databaseName: sweety_db
    user: sweety_user
